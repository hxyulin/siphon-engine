[workspace]
resolver = "3"
members = ["crates/siphon", "crates/siphon-cli", "crates/siphon-cuda", "crates/siphon-mlx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = ["crates-io"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/siphon-engine"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000", "f16"] }
half = "2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
memmap2 = "0.9"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
siphon = { package = "siphon-engine", version = "0.1.0", path = "crates/siphon" }
siphon-cuda = { version = "0.1.0", path = "crates/siphon-cuda" }
siphon-mlx = { version = "0.1.0", path = "crates/siphon-mlx" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
debug = "line-tables-only"
