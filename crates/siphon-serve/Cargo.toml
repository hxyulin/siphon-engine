[package]
name = "siphon-serve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
futures-util = { version = "0.3.34", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1.19", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
siphon = { path = "../siphon" }
siphon-cuda = { path = "../siphon-cuda" }

[lints]
workspace = true
