# CUDA toolkit for building crates/siphon-cuda on Linux. The NVIDIA driver comes from the host.
[workspace]
name = "siphon"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# CUDA 13.5 matches the host driver's CUDA version. From 13.3 on, the driver runs an sm_120
# cubin's SASS as compiled; with 13.0 it recompiled each kernel from the cubin's capmerc section.
cuda-nvcc = "13.5.*"
cuda-cudart-dev = "13.5.*"
# Profilers. nsight-compute releases follow the CUDA version; the nsys CLI has no CUDA pin.
nsight-compute = "2026.4.*"
nsight-systems-cli = "2026.5.*"

[activation.env]
NVCC = "$CONDA_PREFIX/bin/nvcc"
